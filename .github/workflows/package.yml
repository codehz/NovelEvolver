name: package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: package-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: "0"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  # Linux-only: download + convert fonts once, cache across runs, share via artifact.
  # Matrix package jobs must download before bun install so prepare→ensure-fonts is a cache hit
  # (avoids Windows missing `unzip` / flaky CDN during install).
  fonts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-install-

      - name: Cache vendor fonts
        uses: actions/cache@v4
        with:
          path: vendor/fonts
          key: fonts-${{ hashFiles('scripts/fonts.manifest.json', 'scripts/ensure-fonts.mjs') }}
          restore-keys: |
            fonts-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure fonts
        run: bun run fonts:ensure

      - name: Upload vendor fonts
        uses: actions/upload-artifact@v4
        with:
          name: vendor-fonts
          path: vendor/fonts/
          if-no-files-found: error
          retention-days: 1

  package:
    needs: [fonts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            builder_args: --linux AppImage --x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            builder_args: --linux AppImage --arm64
          - os: windows-latest
            platform: windows
            builder_args: --win nsis portable --x64
          - os: windows-11-arm
            platform: windows-arm64
            builder_args: --win nsis portable --arm64
          - os: macos-latest
            platform: macos
            builder_args: --mac dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-install-

      # Must run before install: package.json prepare → ensure-fonts.mjs (needs system unzip
      # only on miss). Pre-seeded WOFF2 + pinned sha256 → cache hit on all platforms.
      - name: Download vendor fonts
        uses: actions/download-artifact@v4
        with:
          name: vendor-fonts
          path: vendor/fonts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Package
        working-directory: apps/desktop
        run: bunx electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovelEvolver-${{ matrix.platform }}-${{ github.sha }}
          path: |
            apps/desktop/release/*
            !apps/desktop/release/*-unpacked/**
            !apps/desktop/release/builder-effective-config.yaml
            !apps/desktop/release/builder-debug.yml
            !apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  mobile-package:
    needs: [fonts]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PR builds must use the source commit, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch main history
        run: git fetch origin main --no-tags

      - name: Calculate Android version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          merge_base="$(git merge-base HEAD origin/main)"
          if [[ -z "$merge_base" ]]; then
            echo "Could not find a common ancestor with origin/main" >&2
            exit 1
          fi

          version_code="$(git rev-list --count --first-parent "$merge_base")"
          if ! [[ "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid Android version code: $version_code" >&2
            exit 1
          fi

          branch_name="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          branch_slug="${branch_name//[^A-Za-z0-9._-]/-}"
          commit_hash="$(git rev-parse --short=12 HEAD)"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version_name="${GITHUB_REF_NAME}-${commit_hash}"
          else
            version_name="dev-${version_code}-${branch_slug}-${commit_hash}"
          fi

          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "Using Android versionName=$version_name"
          echo "Using Android versionCode=$version_code from main ancestor $merge_base"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-install-

      - name: Download vendor fonts
        uses: actions/download-artifact@v4
        with:
          name: vendor-fonts
          path: vendor/fonts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Hermes compiler
        shell: bash
        run: |
          set -euo pipefail
          react_native_dir="$(realpath apps/mobile/node_modules/react-native)"
          hermesc="$(dirname "$react_native_dir")/hermes-compiler/hermesc/linux64-bin/hermesc"
          if [[ ! -x "$hermesc" ]]; then
            echo "Hermes compiler was not linked beside React Native: $hermesc" >&2
            exit 1
          fi
          echo "Using Hermes compiler: $hermesc"

      - name: Cache SQLite amalgamation
        uses: actions/cache@v4
        with:
          path: packages/mobile-sqlite/cpp/sqlite
          key: sqlite-${{ hashFiles('packages/mobile-sqlite/sqlite.manifest.json', 'packages/mobile-sqlite/scripts/ensure-sqlite.mjs') }}
          restore-keys: |
            sqlite-

      - name: Prepare mobile native resources
        run: |
          bun run mobile:fonts
          bun run sqlite:ensure

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Android project state
        uses: actions/cache@v4
        with:
          path: apps/mobile/android/.gradle
          key: android-project-gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle.properties', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'packages/mobile-sqlite/android/**/*.gradle*', 'bun.lock') }}
          restore-keys: |
            android-project-gradle-${{ runner.os }}-

      - name: Prepare release keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "store_file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing Android signing secret: $secret_name" >&2
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/novelevolver-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          test -s "$keystore_path"
          echo "store_file=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          RELEASE_STORE_FILE: ${{ steps.signing.outputs.store_file }}
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle_args=(
            "-PVERSION_CODE=$VERSION_CODE"
            "-PVERSION_NAME=$VERSION_NAME"
          )
          if [[ -n "$RELEASE_STORE_FILE" ]]; then
            gradle_args+=("-PRELEASE_STORE_FILE=$RELEASE_STORE_FILE")
          elif [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "Release builds outside pull requests require Android signing secrets" >&2
            exit 1
          else
            echo "Signing secrets are unavailable; using the local debug keystore for this PR artifact"
          fi
          ./gradlew assembleRelease --no-daemon "${gradle_args[@]}"

      - name: Rename APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          apk_name="${VERSION_NAME//[^A-Za-z0-9._-]/-}"
          mv apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "apps/mobile/android/app/build/outputs/apk/release/NovelEvolver-android-${apk_name}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovelEvolver-android-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  # Tag push (v*): publish one GitHub Release with desktop packages and the Android APK.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, mobile-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: NovelEvolver-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          # Treat semver pre-release tags (e.g. v1.0.0-beta.1) as prereleases.
          prerelease: ${{ contains(github.ref_name, '-') }}
